$description:
  events.enabled: 事件接收总开关（关闭后不记录任何事件，触发器也随之失效）。
  events.enabledEvents: 按事件目录 key 启停单类事件的记录。
  events.feed.include: 按事件目录 key 控制事件清单呈现哪些事件行。
  events.feed.maxEvents: 事件清单最多呈现的事件行数。
  events.history.maxEvents: 每会话事件历史的条数上限。
  events.history.windowMs: 事件历史的时间窗（毫秒，默认 30 分钟）。

$name:
  事件注入配置: 事件注入配置
  事件清单（events 变量）: 事件清单（events 变量）
  事件历史: 事件历史
